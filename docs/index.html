<!DOCTYPE html>
<html lang="ru" data-color-scheme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto City Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Верхняя панель ресурсов -->
    <header class="header">
        <div class="resources">
            <div class="resource">
                <span class="resource-icon">💰</span>
                <span class="resource-value" id="coins">1000</span>
            </div>
            <div class="resource">
                <span class="resource-icon">⚡</span>
                <span class="resource-value" id="energy">100</span>
            </div>
            <div class="resource">
                <span class="resource-icon">⭐</span>
                <span class="resource-value" id="level">1</span>
            </div>
        </div>
        <button class="daily-reward-btn" id="dailyRewardBtn">
            🎁 Награда
        </button>
    </header>

    <!-- Основная игровая зона -->
    <main class="game-container">
        <!-- Главный экран с городом -->
        <div class="screen active" id="cityScreen">
            <div class="city-grid">
                <div class="city-slot" data-slot="0">
                    <div class="building" data-building="1">
                        <span class="building-icon">⛏️</span>
                        <span class="building-level">1</span>
                        <div class="income-popup hidden">+10 💰</div>
                    </div>
                </div>
                <div class="city-slot" data-slot="1">
                    <div class="building" data-building="4">
                        <span class="building-icon">🏠</span>
                        <span class="building-level">1</span>
                        <div class="income-popup hidden">+5 💰</div>
                    </div>
                </div>
                <div class="city-slot empty" data-slot="2"></div>
                <div class="city-slot empty" data-slot="3"></div>
                <div class="city-slot empty" data-slot="4"></div>
                <div class="city-slot empty" data-slot="5"></div>
                <div class="city-slot empty" data-slot="6"></div>
                <div class="city-slot empty" data-slot="7"></div>
                <div class="city-slot empty" data-slot="8"></div>
            </div>
        </div>

        <!-- Экран строительства -->
        <div class="screen" id="buildScreen">
            <h2>Строительство</h2>
            <div class="buildings-list" id="buildingsList">
                <!-- Будет заполнено через JS -->
            </div>
        </div>

        <!-- Экран друзей -->
        <div class="screen" id="friendsScreen">
            <h2>Друзья</h2>
            <div class="friends-list" id="friendsList">
                <!-- Будет заполнено через JS -->
            </div>
        </div>

        <!-- Экран магазина -->
        <div class="screen" id="shopScreen">
            <h2>Магазин</h2>
            <div class="shop-items" id="shopItems">
                <!-- Будет заполнено через JS -->
            </div>
        </div>
    </main>

    <!-- Нижняя панель навигации -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-screen="cityScreen">
            <span class="nav-icon">🏙️</span>
            <span class="nav-text">Город</span>
        </button>
        <button class="nav-btn" data-screen="buildScreen">
            <span class="nav-icon">🔨</span>
            <span class="nav-text">Строить</span>
        </button>
        <button class="nav-btn" data-screen="friendsScreen">
            <span class="nav-icon">👥</span>
            <span class="nav-text">Друзья</span>
        </button>
        <button class="nav-btn" data-screen="shopScreen">
            <span class="nav-icon">🛒</span>
            <span class="nav-text">Магазин</span>
        </button>
    </nav>

    <!-- Модальное окно ежедневных наград -->
    <div class="modal hidden" id="dailyRewardModal">
        <div class="modal-content">
            <h3>Ежедневная награда</h3>
            <div class="reward-info" id="rewardInfo">
                <div class="reward-day">День <span id="rewardDay">1</span></div>
                <div class="reward-items">
                    <div class="reward-item">
                        <span class="reward-icon">💰</span>
                        <span class="reward-amount" id="rewardCoins">100</span>
                    </div>
                    <div class="reward-item">
                        <span class="reward-icon">⚡</span>
                        <span class="reward-amount" id="rewardEnergy">50</span>
                    </div>
                </div>
            </div>
            <button class="btn btn--primary" id="claimRewardBtn">Получить награду</button>
            <button class="btn btn--secondary" id="closeRewardBtn">Закрыть</button>
        </div>
    </div>

    <!-- Модальное окно апгрейда здания -->
    <div class="modal hidden" id="upgradeModal">
        <div class="modal-content">
            <h3>Улучшить здание</h3>
            <div class="upgrade-info" id="upgradeInfo">
                <!-- Будет заполнено через JS -->
            </div>
            <div class="upgrade-actions">
                <button class="btn btn--primary" id="confirmUpgradeBtn">Улучшить</button>
                <button class="btn btn--secondary" id="cancelUpgradeBtn">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Уведомления -->
    <div class="notifications" id="notifications">
        <!-- Уведомления будут добавляться динамически -->
    </div>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
